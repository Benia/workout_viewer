name: workout_viewer
description: Trail workout viewer — HR, pace, elevation, zones, map track sync (Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  collection: ^1.18.0
  xml: ^6.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # FIT: pure Dart parser helper used via our service; optional native later
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
